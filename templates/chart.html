        <body>
            <h1>Marine Debris Data Charts</h1>
        
            <div class="chart-container">
                <!-- Pie Chart -->
                <div class="chart-card">
                    <h2>Marine Debris Distribution</h2>
                    <canvas id="pieChart" class="marine_debris_distribution"></canvas>
                </div>
        
                <!-- Bar Chart -->
                <div class="chart-card">
                    <h2>Marine Debris Count</h2>
                    <canvas id="barChart" class="marine_debris_count"></canvas>
                </div>
        
                <!-- Additional Charts -->
                <div class="chart-card">
                    <h2>Plastic Trends Over Time</h2>
                    <canvas id="plasticChart" class="plastic_trends"></canvas>
                </div>
        
                <div class="chart-card">
                    <h2>Debris Attributes</h2>
                    <canvas id="debrisChart" class="debris_attributes"></canvas>
                </div>
            </div>
        
            <script>
                // Pie Chart
                const pieCtx = document.getElementById('pieChart').getContext('2d');
                new Chart(pieCtx, {
                    type: 'pie',
                    data: {
                        labels: ['Mask', 'Can', 'Cellphone', 'Electronics', 'GBottle', 'Glove', 'Metal', 'Misc', 'Net', 'PBag', 'PBottle', 'Plastic', 'Rod', 'Sunglasses', 'Tire'],
                        datasets: [{
                            label: 'Marine Debris Distribution',
                            data: [12, 15, 8, 10, 7, 20, 18, 14, 9, 16, 22, 30, 5, 11, 8],
                            backgroundColor: ['#ff6384', '#36a2eb', '#ffcd56', '#4bc0c0', '#9966ff', '#ff9f40', '#c9cbcf', '#4b0082', '#800080', '#ff4500', '#2e8b57', '#4682b4', '#ffa500', '#20b2aa', '#8b0000'],
                            borderWidth: 1
                        }]
                    }
                });
        
                // Bar Chart
                const barCtx = document.getElementById('barChart').getContext('2d');
                new Chart(barCtx, {
                    type: 'bar',
                    data: {
                        labels: ['Mask', 'Can', 'Cellphone', 'Electronics', 'GBottle', 'Glove', 'Metal', 'Misc', 'Net', 'PBag', 'PBottle', 'Plastic', 'Rod', 'Sunglasses', 'Tire'],
                        datasets: [{
                            label: 'Marine Debris Count',
                            data: [14, 18, 10, 12, 8, 25, 20, 15, 11, 17, 28, 35, 7, 13, 10],
                            backgroundColor: ['#ff6384', '#36a2eb', '#ffcd56', '#4bc0c0', '#9966ff', '#ff9f40', '#c9cbcf', '#4b0082', '#800080', '#ff4500', '#2e8b57', '#4682b4', '#ffa500', '#20b2aa', '#8b0000'],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
        
                // Line Chart
                const plasticCtx = document.getElementById('plasticChart').getContext('2d');
                new Chart(plasticCtx, {
                    type: 'line',
                    data: {
                        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May'],
                        datasets: [{
                            label: 'Plastic Trends Over Time',
                            data: [50, 55, 60, 65, 70],
                            borderColor: '#ffcd56',
                            fill: false
                        }]
                    }
                });
        
                // Radar Chart
                const debrisCtx = document.getElementById('debrisChart').getContext('2d');
                new Chart(debrisCtx, {
                    type: 'radar',
                    data: {
                        labels: ['Weight', 'Size', 'Hazard Level', 'Frequency'],
                        datasets: [{
                            label: 'Debris Attributes',
                            data: [75, 85, 90, 80],
                            backgroundColor: 'rgba(75,192,192,0.4)',
                            borderColor: '#4bc0c0'
                        }]
                    }
                });
            </script>
